<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Шашки</title>
  <meta name="description" content="Русские шашки, поддавки и международные шашки 10×10 онлайн. Играйте против компьютера на любом уровне сложности или вдвоём на одном устройстве.">
<style>

:root {

  --bg:            #e4e8f0;
  --bg-raised:     #edf0f6;
  --shadow-dark:   #c6ccda;
  --shadow-light:  #f5f7fb;

  --text:          #3c4560;
  --text-muted:    #6b7691;

  --text-strong:   #2b3245;

  --square-light:  #dfe5ef;
  --square-dark:   #a9b4c9;

  --board-frame:   #cfd8e6;

  --accent:        #6f7fc4;

  --accent-deep:   #4a5aa0;

  --track-empty:   #d3d9e6;

  --last-light:    #a9ccf1;
  --last-dark:     #739fd6;

  --step-light:    #cfe1f5;
  --step-dark:     #95afd2;

  --marker:        #6a9fe0;

  --ring:          clamp(3px, .5vmin, 4px);

  --bulb:          #6bbdf0;

  --hint:          #8fc3ec;

  --deny-ring:     #ce6a68;

  --marker-capture:      #b9505a;
  --last-capture-light:  #e4a6a6;
  --last-capture-dark:   #c5686e;
  --step-capture-light:  #e2c6ca;
  --step-capture-dark:   #b78e9c;

  --board-max: min(96vw, 760px);

  --board-size: min(96vw, 70vh, 760px);
  --move-ms: 300ms;
  --fade-ms: 340ms;

  --highlight-ms: 600ms;

  --pattern:       rgba(146, 159, 190, .14);

  --tile:          clamp(26px, 4.4vmin, 56px);

  --pattern-min:   rgba(0, 0, 0, .3);
  --spot-center:   #e1e6ee;

}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  font-family: "Segoe UI", Roboto, system-ui, sans-serif;
  background-color: var(--bg);

  background-image:
    radial-gradient(ellipse 78vw 98vh at 50% 46%,
                    var(--spot-center) 0%, var(--bg) 100%);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    conic-gradient(var(--pattern) 0 25%, transparent 0 50%,
                   var(--pattern) 0 75%, transparent 0);
  background-size: calc(var(--tile) * 2) calc(var(--tile) * 2);
  background-position: center;

  -webkit-mask-image: radial-gradient(ellipse 78vw 98vh at 50% 46%,
                      var(--pattern-min) 0, #000 100%);
  mask-image: radial-gradient(ellipse 78vw 98vh at 50% 46%,
              var(--pattern-min) 0, #000 100%);
}

body:not(.is-game)::before {
  animation: pattern-drift 20s linear infinite;
}

@keyframes pattern-drift {
  from { background-position: 50% 50%; }
  to   { background-position: calc(50% + var(--tile) * 2) 50%; }
}

@media (prefers-reduced-motion: reduce) {
  body:not(.is-game)::before { animation: none; }
}

.screen { z-index: 1; }
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(ellipse 75% 70% at 50% 45%,
              transparent 45%, rgba(58, 68, 98, .16) 100%);
}

#bowl-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  -webkit-mask-image: radial-gradient(ellipse 78vw 98vh at 50% 46%,
                      var(--pattern-min) 0, #000 100%);
  mask-image: radial-gradient(ellipse 78vw 98vh at 50% 46%,
              var(--pattern-min) 0, #000 100%);
}

body.bowl-geo::before { background-image: none; }

@property --pattern-min {
  syntax: '<color>';
  inherits: true;
  initial-value: rgba(0, 0, 0, .3);
}
@property --spot-center {
  syntax: '<color>';
  inherits: true;
  initial-value: #e1e6ee;
}

body { transition: --pattern-min .3s ease, --spot-center .3s ease; }

body.is-game {
  --pattern-min: transparent;
  --spot-center: #dee3ec;
}

[hidden] { display: none !important; }

.screen {
  position: relative;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  width: 100%;
  height: 100%;
  padding: 16px clamp(6px, 2vw, 16px);
}

.screen--active {
  display: flex;
  animation: screen-in .3s ease-out both;
}

@keyframes screen-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.screen--active .board { animation: board-in .3s ease-out both; }

@keyframes board-in {
  from { transform: scale(.99); }
  to   { transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .screen--active,
  .screen--active .board { animation: none; }
}

@media (max-height: 520px) {
  .screen { gap: 8px; padding: 8px; }
}

.emblem {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: clamp(4px, 1.2vh, 14px);
}

.emblem .piece {
  width: clamp(68px, 17vmin, 140px);
  height: clamp(68px, 17vmin, 140px);
}

.emblem .piece--white {
  position: relative;
  z-index: 1;
  margin-right: -32%;
}

.emblem { animation: emblem-float 6s ease-in-out infinite; }

@keyframes emblem-float {
  0%, 100% { translate: 0 0; }
  50%      { translate: 0 -6px; }
}

@media (prefers-reduced-motion: reduce) {
  .emblem { animation: none; }
}

@media (max-width: 460px) {
  .emblem .piece { width: 24vmin; height: 24vmin; }
}

@font-face {
  font-family: 'Cormorant Local';
  src: url('fonts/cormorant-medium.ttf') format('truetype');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Cormorant Local';
  src: url('fonts/cormorant-semibold.ttf') format('truetype');
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}

.title {
  font-family: 'Cormorant Local', Georgia, 'Times New Roman', serif;

  font-size: clamp(34px, 8.6vmin, 64px);
  font-weight: 500;
  line-height: 1.08;
  letter-spacing: .5px;
  text-align: center;
  color: var(--text-strong);

}

.title--sub {
  font-size: clamp(20px, 5vmin, 32px);
  font-weight: 600;
}

#app-title {
  --title-ls: .16em;
  --diamond: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><path d='M5 0 10 5 5 10 0 5Z' fill='%232b3245'/></svg>");
  font-size: clamp(24px, 5.2vmin, 54px);
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
  margin-bottom: .18em;
}

@media (max-width: 460px) {
  #app-title { font-size: 9vmin; }
}

.title__top,
.title__main {
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: var(--title-ls);

  margin-right: calc(-1 * var(--title-ls));
}

.title__main {
  margin-top: .14em;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#app-title.title--intl .title__top {
  letter-spacing: .09em;
  margin-right: -.09em;
}

.title__main::after {
  content: "";
  width: 70%;
  height: .6em;
  margin-top: .08em;

  transform: translateX(calc(var(--title-ls) / -2 + .17em));
  background:
    var(--diamond) center / .3em .3em no-repeat,
    linear-gradient(var(--text-muted), var(--text-muted)) left center / calc((100% - .75em) / 2) 2px no-repeat,
    linear-gradient(var(--text-muted), var(--text-muted)) right center / calc((100% - .75em) / 2) 2px no-repeat;
}

@media (max-width: 460px) {
  .title__main::after {
    background-size: .3em .3em, calc((100% - .75em) / 2) 1.5px, calc((100% - .75em) / 2) 1.5px;
  }
}

.menu {
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 1.6vh, 22px);

  width: min(clamp(225px, 30vmin, 300px), 58vw);
  margin-top: 4px;
}

.menu .btn {
  font-weight: 600;
  font-size: clamp(15px, 2.9vmin, 24px);
  padding: clamp(13px, 1.7vh, 22px) 20px;
}

#difficulty-list { width: min(300px, 80vw); gap: clamp(12px, 1.6vh, 18px); }
#difficulty-list .btn {
  font-size: clamp(15px, 2.9vmin, 20px);
  padding: clamp(13px, 1.7vh, 18px) 20px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font: inherit;
  font-size: clamp(14px, 2.6vmin, 17px);
  padding: 14px 20px;
  border: none;
  border-radius: 14px;
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
  transition: box-shadow .15s, color .15s, transform .15s;
}

.btn:hover { color: var(--accent); }

#btn-hint:hover:not(:disabled) { color: inherit; }

@media (hover: hover) {

  .btn:hover:not(:disabled) { transform: scale(1.03); }
}

.btn:active {
  box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
  transform: scale(.99);
}

.btn--small {
  padding: 12px 14px;
  border-radius: 14px;
  box-shadow: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
}

.btn--small:active {
  box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
}

.btn--back {

  font-size: clamp(14px, 2.5vmin, 17px);

  font-weight: 600;
  padding: 9px 20px;
  border-radius: 12px;
  color: var(--text-muted);
  margin-top: 6px;
  box-shadow: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
}

.btn--back:hover { color: var(--accent); }

@media (min-height: 521px) {
  #btn-settings-back {
    font-size: clamp(14px, 1.7vmin, 21px);
    padding: .53em 1.18em;
  }
}

.btn--back:active {
  box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
}

.btn--icon { padding: 12px 14px; }
.btn--icon.is-off { opacity: .55; }

@media (min-width: 900px) {
  .btn--icon { padding: 14px 16px; }
  .btn--icon .icon { width: 28px; height: 28px; }

  #btn-hint {
    padding: 16px;
    margin-block: -2px;
  }

  .screen { gap: 14px; padding: 10px clamp(6px, 2vw, 16px); }
}

.icon {
  width: 25px;
  height: 25px;
  display: block;
  flex: none;
}

#btn-hint .icon { overflow: visible; }

.btn__label { line-height: 1; }

.btn:disabled {
  opacity: .45;
  cursor: default;
  box-shadow: 2px 2px 5px var(--shadow-dark), -2px -2px 5px var(--shadow-light);
}

.btn:disabled:hover { color: var(--text); }

.btn--waiting:disabled {
  box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
  opacity: 1;
}

.btn--adv { position: relative; }
.btn--adv::after {
  content: '';
  position: absolute;
  top: -4px;
  right: -4px;
  width: 19px;
  height: 19px;
  border-radius: 50%;
  background: var(--accent)
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M4.4 3.1 L9 6 L4.4 8.9 Z' fill='%23ffffff'/></svg>")
    center/13px no-repeat;
  box-shadow: 0 0 0 2px var(--bg-raised);
}
.btn--adv:disabled::after { opacity: .45; }

.btn--level {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  text-align: left;
  padding: 16px 74px 16px 18px;
}

.btn--level .level-name { font-weight: 600; }

.level-dots {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  gap: 5px;
}

.level-dots i {
  width: 13px;
  height: 6px;
  border-radius: 3px;
  background: var(--bg);
  box-shadow: inset 1px 1px 2px var(--shadow-dark), inset -1px -1px 2px var(--shadow-light);
}

.level-dots i.on {
  background: var(--level-mark, var(--accent-deep));
  box-shadow: none;
}

.settings {

  font-size: clamp(15px, 2vmin, 25px);
  display: flex;
  flex-direction: column;
  gap: .93em;
  width: min(66vw, 16.7em);
  margin-top: .67em;
}

.settings__cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .93em;
  width: min(100%, 15em);
  margin: 0 auto;
}

.card {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;

  min-height: 4em;
  gap: .4em;
  padding: .5em .6em;
  border-radius: 1.07em;
  background: var(--bg);
  box-shadow: .33em .33em .73em var(--shadow-dark), -.33em -.33em .73em var(--shadow-light);
}

.card__label {
  font-size: .93em;
  font-weight: 600;
}

.card__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: .5em;
}

.card__label {
  flex: none;
  white-space: nowrap;
}

.card__value {
  font-size: .8em;
  font-weight: 600;
  color: var(--accent);
  font-variant-numeric: tabular-nums;

  min-width: 1.7em;
  text-align: right;
  white-space: nowrap;
}

.card__value.is-off {

  color: var(--text-muted);
  font-weight: 400;
}

.range {
  --pct: 100%;

  --thumb: 1.45em;
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 1.6em;
  margin: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
}

.range::-webkit-slider-runnable-track {
  height: .7em;
  border-radius: .35em;
  background: linear-gradient(to right,
              var(--accent) var(--pct), var(--track-empty) var(--pct));
}

.range::-moz-range-track {
  height: .7em;
  border-radius: .35em;
  background: linear-gradient(to right,
              var(--accent) var(--pct), var(--track-empty) var(--pct));
}

.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: var(--thumb);
  height: var(--thumb);

  margin-top: calc((.7em - var(--thumb)) / 2);
  border: 1px solid var(--track-empty);
  border-radius: 50%;
  background: #ffffff;
  box-shadow: .1em .12em .3em rgba(60, 69, 96, .32);
}

.range::-moz-range-thumb {
  width: var(--thumb);
  height: var(--thumb);
  border: 1px solid var(--track-empty);
  border-radius: 50%;
  background: #ffffff;
  box-shadow: .1em .12em .3em rgba(60, 69, 96, .32);
}

.range::-webkit-slider-thumb { transition: width .12s ease, height .12s ease, margin-top .12s ease; }
.range::-moz-range-thumb { transition: width .12s ease, height .12s ease; }

@media (hover: hover) {
  .range:hover { --thumb: 1.6em; }
}

.range:focus { outline: none; }

.settings__group {
  margin: .4em 0 -.27em;
  font-size: .8em;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--text-muted);
  text-align: center;
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .93em;
  width: min(100%, 15em);
  margin: 0 auto;
}

.option--wide {
  grid-column: 1 / -1;
  justify-self: center;
  width: 66%;
}

.option {
  display: flex;
  align-items: center;
  justify-content: center;

  min-height: 3em;
  gap: .93em;
  padding: .7em .8em;

  border: 2px solid transparent;
  border-radius: 1.07em;
  background: var(--bg);
  color: var(--text-muted);
  font: inherit;
  font-size: 1.07em;
  line-height: 1.25;
  text-align: center;
  cursor: pointer;
  box-shadow: .33em .33em .73em var(--shadow-dark), -.33em -.33em .73em var(--shadow-light);
  transition: color .15s, border-color .15s, background-color .15s, box-shadow .15s;
}

.option:hover { color: var(--text); }

.option.is-on {
  color: var(--accent);
  font-weight: 600;
  border-color: var(--accent);
  background: var(--bg-raised);

  box-shadow: none;
}

.side {
  display: flex;
  justify-content: center;
  margin-top: 6px;
}

.side__options {
  display: flex;
  gap: 12px;
}

.side__option {
  width: clamp(56px, 13vmin, 68px);
  height: clamp(56px, 13vmin, 68px);
  padding: 0;
  border: none;
  border-radius: 16px;
  background: var(--square-dark);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
  transition: box-shadow .16s, transform .16s;
}

.side__option.is-on {
  box-shadow: 0 0 0 var(--ring) var(--marker),
              4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
}

.piece--mixed {
  background: none;
  position: relative;
}

.piece.piece--half {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.piece--half-left  { clip-path: inset(0 50% 0 0); }
.piece--half-right { clip-path: inset(0 0 0 50%); }

.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  max-width: var(--board-max);
}

.topbar__group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.bottom {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: var(--board-max);

  height: 34px;
}

.bottom .score    { grid-column: 1; justify-self: start; }

.bottom .thinking {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  gap: 6px;
  align-items: center;
}

.thinking i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-muted);
  animation: thinking-dot 1.2s ease-in-out infinite;
}

.thinking i:nth-child(2) { animation-delay: .2s; }
.thinking i:nth-child(3) { animation-delay: .4s; }

@keyframes thinking-dot {
  0%, 70%, 100% { opacity: .22; transform: scale(.85); }
  35%           { opacity: 1;   transform: scale(1); }
}

.mode-label {
  color: var(--text-muted);
  font-size: clamp(11px, 2.2vmin, 13px);
}

.review {
  position: absolute;
  left: 50%;
  top: calc(100% + 6px);
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 2;
}

.screen--review .mode-label { visibility: hidden; }

@media (max-width: 460px) {
  .review { gap: 6px; }
  .review .btn--icon { padding: 9px 11px; border-radius: 12px; }
}

@media (max-height: 520px) and (orientation: landscape) {
  #screen-game .review {
    position: static;
    transform: none;
    flex-direction: column;
    gap: 6px;
  }
}

.score {
  display: flex;
  align-items: center;
  gap: 14px;

  position: relative;
  top: -6px;
}

.score__side {
  display: flex;
  align-items: center;
  gap: 7px;
}

.score__chip {
  width: clamp(14px, 2.8vmin, 20px);
  height: clamp(14px, 2.8vmin, 20px);
  border-radius: 50%;
  flex: none;
}

.score__chip--white {
  background: radial-gradient(circle at 33% 28%,
              #ffffff 0%, #f4f7fc 32%, #dde3ee 66%, #bcc5d8 100%);
  box-shadow: 2px 2px 4px var(--shadow-dark);
}

.score__chip--black {
  background: radial-gradient(circle at 34% 30%,
              #56617f 0%, #2c3550 28%, #172033 62%, #0b101b 100%);
  box-shadow: 2px 2px 4px var(--shadow-dark);
}

.score__count {
  font-size: clamp(14px, 2.8vmin, 18px);
  font-weight: 600;
  min-width: 1.2em;
  text-align: center;
}

@media (max-height: 520px) {
  .score__chip { width: 12px; height: 12px; }
  .score__count { font-size: 13px; }
}

.board-area {
  flex: 0 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
}

.board-area .board { grid-column: 2; }

.board {
  position: relative;
  flex: none;
  width: var(--board-size);
  height: var(--board-size);
  border: 12px solid var(--board-frame);
  border-radius: 24px;
  background: var(--board-frame);
  box-shadow: 9px 9px 20px var(--shadow-dark), -9px -9px 20px var(--shadow-light);
  overflow: hidden;
  touch-action: none;
}

@media (max-width: 460px) {

.board--dragging { overflow: visible; }

.board--flipped .cells,
.board--flipped .pieces { transform: rotate(180deg); }

.board--flipped .cell[data-file]::after,
.board--flipped .cell[data-rank]::before { transform: rotate(180deg); }

.board--flipped .cell[data-file]::after {
  right: auto; left: 4px;
  bottom: auto; top: 2px;
}

.board--flipped .cell[data-rank]::before {
  left: auto; right: 4px;
  top: auto; bottom: 2px;
}

.board--flipped .piece,
.board--flipped .marker { transform: rotate(180deg); }

.cells {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  border-radius: 12px;
  overflow: hidden;
}

.pieces {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.cell {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;

  transition: background-color var(--highlight-ms) cubic-bezier(.4, 0, .2, 1);
}

.cell--light { background: var(--square-light); }
.cell--dark  { background: var(--square-dark); }

.cell[data-file]::after,
.cell[data-rank]::before {
  position: absolute;

  font-size: clamp(8px, 1.6vmin, 12px);
  font-weight: 700;
  opacity: .5;
  pointer-events: none;
  color: var(--text-muted);
}

.cell[data-file]::after  { content: attr(data-file); right: 4px; bottom: 2px; }
.cell[data-rank]::before { content: attr(data-rank); left: 4px;  top: 2px; }

.cell--last.cell--light { background: var(--last-light); }
.cell--last.cell--dark  { background: var(--last-dark); }

.cell--last-step.cell--light { background: var(--step-light); }
.cell--last-step.cell--dark  { background: var(--step-dark); }

.cell--last.cell--last-capture.cell--light { background: var(--last-capture-light); }
.cell--last.cell--last-capture.cell--dark  { background: var(--last-capture-dark); }
.cell--last-step.cell--last-capture.cell--light { background: var(--step-capture-light); }
.cell--last-step.cell--last-capture.cell--dark  { background: var(--step-capture-dark); }

.piece { transition: scale .12s ease; }

.piece--movable.piece--hovered { scale: 1.05; }

.piece--selected { scale: 1.05; }

.piece--selected { box-shadow: 0 0 0 var(--ring) var(--marker); }

@media (pointer: coarse) {
  .board--10 { --ring: clamp(2px, .38vmin, 3px); }
}

.cell--hint-to .marker { background: var(--hint); animation: hint-pulse 1.1s ease-in-out infinite; }

.piece--hinted::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  box-shadow: 0 0 0 var(--ring) var(--hint);
  animation: hint-pulse 1.1s ease-in-out infinite;
}

@keyframes hint-pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .25; }
}

.piece--playable { animation: playable-ring 620ms ease-in-out 1; }

.piece--rejected { animation: rejected-ring 620ms ease-in-out 1; }

@keyframes rejected-ring {
  0%, 100% { box-shadow: 0 0 0 var(--ring) rgba(206, 106, 104, 0); }
  50%      { box-shadow: 0 0 0 var(--ring) var(--deny-ring); }
}

@keyframes playable-ring {
  0%, 100% { box-shadow: 0 0 0 var(--ring) rgba(106, 159, 224, 0); }
  50%      { box-shadow: 0 0 0 var(--ring) var(--marker); }
}

.cell--target { cursor: pointer; }
.cell--capture .marker { background: var(--marker-capture); }

.marker {
  width: 26%;
  height: 26%;
  border-radius: 50%;
  background: var(--marker);
  box-shadow: inset 1px 1px 3px rgba(10, 30, 60, .5),
              inset -1px -1px 3px rgba(255, 255, 255, .28);
  pointer-events: none;
}

.piece-slot {
  position: absolute;

  width: calc(100% / var(--board-size, 8));
  height: calc(100% / var(--board-size, 8));
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform var(--move-ms) cubic-bezier(.34, .8, .36, 1);
}

@supports (-webkit-touch-callout: none) {
  .piece-slot { transition-timing-function: ease; }
}

.piece-slot--dragging {
  z-index: 2;
  transition: none;
}

.piece-slot--dragging .piece { scale: 1.1; }

.piece-slot--stuck { transition: none; }

.piece-slot--springing { transition: transform .15s ease-out; }

.board--dragging .piece--selected,
.board--hand .piece--selected { box-shadow: none; }

.board--dragging .piece--hinted::before,
.board--hand .piece--hinted::before { display: none; }

.piece-slot--gone { pointer-events: none; }

@keyframes piece-back {
  from { opacity: 0; scale: .4; }
  to   { opacity: var(--vanish-from, 1); scale: 1; }
}

.piece-slot--back .piece {
  animation: piece-back var(--fade-ms) ease-in-out;
  will-change: scale, opacity;
}

.piece-slot--gone .piece {
  animation: piece-back var(--fade-ms) ease-in-out reverse forwards;
  will-change: scale, opacity;
}

.piece {
  position: relative;
  width: 80%;
  height: 80%;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.piece--white {
  background: radial-gradient(circle at 33% 28%,
              #ffffff 0%, #f4f7fc 32%, #dde3ee 66%, #bcc5d8 100%);
}

.piece--black {
  background: radial-gradient(circle at 34% 30%,
              #56617f 0%, #2c3550 28%, #172033 62%, #0b101b 100%);
}

.pieces .piece,
.side__option > .piece { filter: drop-shadow(1px 2.5px 3px rgba(30, 40, 70, .35)); }

.emblem .piece { filter: drop-shadow(2px 5px 6px rgba(30, 40, 70, .35)); }

.piece--king::after {
  content: "";
  position: absolute;
  width: 46%;
  height: 46%;
  border-radius: 50%;
}

.piece--white.piece--king::after {
  box-shadow: inset 3px 4px 6px #aeb7ca, inset -3px -3px 5px #ffffff;
}

.piece--black.piece--king::after {
  box-shadow: inset 3px 4px 6px #05080f, inset -3px -3px 5px #3b4561;
}

.piece--doomed { opacity: .62; }

.modal {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(228, 232, 240, .74);
  animation: result-in .25s ease-out;

.modal__panel {

  text-align: center;

@keyframes result-in {

@keyframes result-panel-in {
